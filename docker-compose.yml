services:
  neo4j:
    image: neo4j:5
    ports:
      - "${NEO4J_HOST_HTTP_PORT:-7474}:7474"
      - "${NEO4J_HOST_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/snowdroppassword
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kvrocks:
    image: apache/kvrocks:latest
    ports:
      - "${KVROCKS_HOST_PORT:-6666}:6666"
    volumes:
      - kvrocks_data:/var/lib/kvrocks

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SNOWDROP_HOST_PG_PORT:-5432}:${PGWIRE_PORT:-5432}"
      - "${SNOWDROP_HOST_HEALTH_PORT:-8080}:${HEALTH_PORT:-8080}"
      - "${SNOWDROP_HOST_METRICS_PORT:-9090}:${METRICS_PORT:-9090}"
    depends_on:
      neo4j:
        condition: service_healthy
      kvrocks:
        condition: service_started
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: snowdroppassword
      KVROCKS_ADDR: kvrocks:6666
      WAL_PATH: /data/wal
      ROCKS_PATH: /data/rocks
      STORAGE_BACKEND: rocksdb
      SNOWDROP_ENABLE_TRUSTED_BULK_LOAD: "1"
      RUST_LOG: info
      PGWIRE_PORT: ${PGWIRE_PORT:-5432}
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      METRICS_PORT: ${METRICS_PORT:-9090}
    volumes:
      - wal_data:/data/wal
      - rocks_data:/data/rocks

  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tpch
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  neo4j_data: {}
  kvrocks_data: {}
  wal_data: {}
  rocks_data: {}
  pg_data: {}
