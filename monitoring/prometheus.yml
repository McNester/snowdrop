global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  # crypto-demo benchmark metrics (native process on the host, port 9091)
  - job_name: crypto-demo
    static_configs:
      - targets: ["host.docker.internal:9091"]

  # Snowdrop orchestrator metrics (native process on the host, port 9090)
  - job_name: snowdrop
    static_configs:
      - targets: ["host.docker.internal:9090"]
