<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snowdrop Migration Speed Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;
        --panel: #151515;
        --panel-2: #202020;
        --line: #3a3a3a;
        --text: #f4f4f4;
        --muted: #aaaaaa;
        --good: #e7ffe7;
        --bad: #ffe7e7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 50% -10%, rgba(255, 255, 255, 0.16), transparent 34rem),
          linear-gradient(180deg, #0b0b0b, var(--bg));
        color: var(--text);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: end;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(30px, 5vw, 64px);
        letter-spacing: 0;
      }
      .subtitle {
        color: var(--muted);
        margin-top: 8px;
        max-width: 680px;
      }
      .status {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        padding: 12px 14px;
        min-width: 220px;
      }
      .grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 18px;
      }
      .panel {
        border: 1px solid var(--line);
        background: rgba(18, 18, 18, 0.92);
        padding: 18px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }
      select,
      button {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        padding: 11px 12px;
        font: inherit;
      }
      button {
        cursor: pointer;
        margin-top: 12px;
        font-weight: 700;
      }
      button:hover {
        background: #2a2a2a;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .metric {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 14px;
        min-height: 108px;
      }
      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }
      .metric strong {
        display: block;
        margin-top: 10px;
        font-size: clamp(24px, 4vw, 42px);
      }
      .metric small {
        display: block;
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.35;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        color: #dddddd;
        background: #111;
        border: 1px solid var(--line);
        padding: 12px;
        max-height: 170px;
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      td,
      th {
        border-bottom: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        color: #eeeeee;
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      .matched {
        color: var(--good);
      }
      .mismatch {
        color: var(--bad);
      }
      @media (max-width: 860px) {
        header,
        .grid,
        .cards {
          grid-template-columns: 1fr;
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Snowdrop vs PostgreSQL</h1>
          <div class="subtitle">Live migration demo over the ticketing/orders workload. The same SQL is executed against both engines and compared immediately.</div>
        </div>
        <div class="status" id="status">Connecting...</div>
      </header>

      <section class="grid">
        <aside class="panel">
          <label for="query">Query</label>
          <select id="query"></select>
          <button id="compare">Run comparison</button>
          <button id="snowdrop">Run Snowdrop only</button>
          <button id="postgres">Run PostgreSQL only</button>
        </aside>

        <section>
          <div class="cards">
            <div class="metric"><span>PostgreSQL</span><strong id="pg-ms">-</strong></div>
            <div class="metric"><span>Snowdrop</span><strong id="sd-ms">-</strong></div>
            <div class="metric"><span>Snowdrop result</span><strong id="speedup">-</strong><small id="speedup-detail">Run comparison</small></div>
          </div>
          <div class="panel">
            <h2 id="query-title">Choose a query</h2>
            <p id="query-description" class="subtitle"></p>
            <pre id="sql"></pre>
            <div id="match"></div>
            <div id="rows"></div>
          </div>
        </section>
      </section>
    </main>

    <script>
      const querySelect = document.getElementById("query");
      const statusBox = document.getElementById("status");
      const sqlBox = document.getElementById("sql");
      const title = document.getElementById("query-title");
      const desc = document.getElementById("query-description");
      const rowsBox = document.getElementById("rows");
      const matchBox = document.getElementById("match");
      let queries = [];

      function ms(value) {
        return value ? `${value.toFixed(2)} ms` : "-";
      }

      function renderSnowdropResult(postgresMs, snowdropMs, ratio) {
        const speedup = document.getElementById("speedup");
        const detail = document.getElementById("speedup-detail");
        if (!postgresMs || !snowdropMs || !ratio) {
          speedup.textContent = "-";
          detail.textContent = "Run comparison";
          return;
        }
        if (ratio >= 1) {
          speedup.textContent = `${ratio.toFixed(2)}x faster`;
          detail.textContent = `Snowdrop ${snowdropMs.toFixed(2)} ms vs PostgreSQL ${postgresMs.toFixed(2)} ms`;
          speedup.className = "matched";
        } else {
          const slower = snowdropMs / postgresMs;
          speedup.textContent = `${slower.toFixed(2)}x slower`;
          detail.textContent = `Raw ratio: ${ratio.toFixed(2)}x of PostgreSQL speed`;
          speedup.className = "mismatch";
        }
      }

      function selected() {
        return queries.find((q) => q.name === querySelect.value);
      }

      function showQuery() {
        const q = selected();
        if (!q) return;
        title.textContent = q.name.replaceAll("_", " ");
        desc.textContent = q.description || "";
        sqlBox.textContent = q.sql;
      }

      function renderRows(rows) {
        if (!rows || rows.length === 0) {
          rowsBox.innerHTML = "<p class='subtitle'>No rows returned.</p>";
          return;
        }
        const head = rows[0].map((_, i) => `<th>col ${i + 1}</th>`).join("");
        const body = rows
          .slice(0, 12)
          .map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`)
          .join("");
        rowsBox.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
      }

      async function loadQueries() {
        const res = await fetch("/queries");
        queries = await res.json();
        querySelect.innerHTML = queries.map((q) => `<option value="${q.name}">${q.name}</option>`).join("");
        statusBox.textContent = "Ready";
        showQuery();
      }

      async function compare() {
        const q = selected();
        statusBox.textContent = "Running comparison...";
        const res = await fetch("/compare-query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: q.name })
        });
        const data = await res.json();
        document.getElementById("pg-ms").textContent = ms(data.postgres.latency_ms);
        document.getElementById("sd-ms").textContent = ms(data.snowdrop.latency_ms);
        renderSnowdropResult(data.postgres.latency_ms, data.snowdrop.latency_ms, data.speedup_vs_postgres);
        matchBox.innerHTML = data.matched ? "<p class='matched'>Result sets matched.</p>" : "<p class='mismatch'>Result sets differ or one engine returned an error.</p>";
        renderRows(data.snowdrop.rows.length ? data.snowdrop.rows : data.postgres.rows);
        statusBox.textContent = "Ready";
      }

      async function runOne(engine) {
        const q = selected();
        statusBox.textContent = `Running ${engine}...`;
        const res = await fetch("/run-query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: q.name, engine })
        });
        const data = await res.json();
        document.getElementById(engine === "postgres" ? "pg-ms" : "sd-ms").textContent = ms(data.run.latency_ms);
        matchBox.innerHTML = data.run.error ? `<p class='mismatch'>${data.run.error}</p>` : "";
        renderRows(data.run.rows);
        statusBox.textContent = "Ready";
      }

      querySelect.addEventListener("change", showQuery);
      document.getElementById("compare").addEventListener("click", compare);
      document.getElementById("snowdrop").addEventListener("click", () => runOne("snowdrop"));
      document.getElementById("postgres").addEventListener("click", () => runOne("postgres"));
      loadQueries().catch((err) => {
        statusBox.textContent = err.message;
      });
    </script>
  </body>
</html>
