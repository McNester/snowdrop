services:
  neo4j:
    image: neo4j:5
    platform: linux/arm64
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/snowdroppassword
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kvrocks:
    image: apache/kvrocks:latest
    platform: linux/arm64
    ports:
      - "6666:6666"
    volumes:
      - kvrocks_data:/var/lib/kvrocks

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
      kvrocks:
        condition: service_started
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: snowdroppassword
      KVROCKS_ADDR: kvrocks:6666
      WAL_PATH: /data/wal
      RUST_LOG: info
    volumes:
      - wal_data:/data/wal

volumes:
  neo4j_data: {}
  kvrocks_data: {}
  wal_data: {}
