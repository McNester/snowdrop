[package]
name = "sndsql"
version = "0.1.0"
edition = "2021"
description = "Snowdrop interactive SQL client"

[[bin]]
name = "sndsql"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
clap = { version = "4", features = ["derive"] }
rustyline = "13"
