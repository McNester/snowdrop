services:
  migration-speed-demo:
    build:
      context: .
      dockerfile: demo/migration-speed-demo/Dockerfile
    ports:
      - "${DEMO_HOST_PORT:-8095}:8095"
    environment:
      DEMO_PORT: 8095
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing_orders_large
      SNOWDROP_HOST: orchestrator
      SNOWDROP_PORT: 5432
      SNOWDROP_USER: postgres
      SNOWDROP_DB: ticketing_orders_large_snowdrop
      QUERY_CATALOG_PATH: /app/tests/large_postgres_bases_for_test/ticketing_orders/benchmark_queries_snowdrop_favorable.json
    networks:
      - snowdrop-1_default

networks:
  snowdrop-1_default:
    external: true
